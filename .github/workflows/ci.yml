name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  migrations:
    name: Миграции (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: food_db
          POSTGRES_USER: food_user
          POSTGRES_PASSWORD: ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U food_user -d food_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_OVERRIDE: postgresql+asyncpg://food_user:ci_pass@localhost:5432/food_db
      SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: upgrade head
        run: alembic upgrade head
      - name: модели совпадают со схемой
        run: alembic check
      - name: downgrade base → upgrade head
        run: alembic downgrade base && alembic upgrade head
